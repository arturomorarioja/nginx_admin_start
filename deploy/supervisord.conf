; Supervisor manages NGINX and the three .NET applications
; as independent processes within a single Docker container.
; It starts them automatically and restarts them if they fail.
;
; It allows a Docker container behave more like a conventional 
; server hosting multiple applications
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:learning]
command=/usr/share/dotnet/dotnet /opt/cedar/learning/Learning.Web.dll
directory=/opt/cedar/learning
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:certificates]
command=/usr/share/dotnet/dotnet /opt/cedar/certificates/Certificates.Web.dll
directory=/opt/cedar/certificates
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:staff]
command=/usr/share/dotnet/dotnet /opt/cedar/staff/Staff.Web.dll
directory=/opt/cedar/staff
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
